model_name: "hey_kryzeth"

target_phrase:
- "hey kryzeth"

custom_negative_phrases:
- "hey jarvis"
- "hey siri"
- "okay google"
- "hello kryzeth"
- "hey kris"
- "hey christ"

n_samples: 10000
n_samples_val: 2000

tts_batch_size: 25
augmentation_batch_size: 8

piper_sample_generator_path: "./piper-sample-generator"

output_dir: "./output"

rir_paths:
- "./mit_rirs"

background_paths:
- "./background_clips"

background_paths_duplication_rate:
- 1

